<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092c55">
  <title>Rush Café – Presentasjon</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #092c55;
    }
    body { font-family: Arial, Helvetica, sans-serif; }
    .presentation {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: #092c55;
    }
    iframe {
      display: block; width: 100%; height: 100%;
      border: 0; background: #092c55;
    }
  </style>
</head>
<body>
  <main class="presentation">
    <iframe
      src="https://docs.google.com/presentation/d/e/2PACX-1vSnrjWDvcWm-s-foQPWzNnAInd7Znp41VNa-iTKynQIuwmw0QRdu00J0p9BMhrWdPrw0fzQxlVAmOsO/embed?start=true&amp;loop=true&amp;delayms=5000&amp;rm=minimal"
      title="Rush Café – presentasjon"
      allow="autoplay; fullscreen"
      allowfullscreen
      loading="eager">
    </iframe>
  </main>
</body>
</html>
